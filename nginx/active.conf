# Q1(a) / Q1(b) run 2 / Q1(c) "AFTER": round-robin over three backends, with passive health checks + retry.
#   max_fails=1 fail_timeout=10s -> after one failure, skip that backend for 10 s
#   proxy_next_upstream ...      -> a request that hits a dead/erroring backend is retried on the next one
upstream ledger {
    server backend1:3000 max_fails=1 fail_timeout=10s;
    server backend2:3000 max_fails=1 fail_timeout=10s;
    server backend3:3000 max_fails=1 fail_timeout=10s;
}
server {
    listen 80;
    location / {
        proxy_pass http://ledger;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 5s;
        include /etc/nginx/conf.d/proxy-common.inc;
    }
}
