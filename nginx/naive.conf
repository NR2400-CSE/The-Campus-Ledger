# Q1(c) "BEFORE": plain round-robin over three backends with
#   max_fails=0            -> never marks a dead backend as down
#   proxy_next_upstream off -> never retries a failed request elsewhere
# so every request that lands on a stopped instance is returned to the user as an error.
upstream ledger {
    server backend1:3000 max_fails=0;
    server backend2:3000 max_fails=0;
    server backend3:3000 max_fails=0;
}
server {
    listen 80;
    location / {
        proxy_pass http://ledger;
        proxy_next_upstream off;
        include /etc/nginx/conf.d/proxy-common.inc;
    }
}
